services:
  - type: web
    name: resume-engine
    runtime: docker
    repo: https://github.com/Aalihaidar/resume-engine
    branch: main
    dockerfilePath: ./docker/Dockerfile.prod
    dockerContext: .
    plan: free
    # Deploy a commit on main only once its GitHub checks (CI) have passed.
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000
