# Runs the production image locally, e.g.:
#   docker compose -f docker-compose.prod.yml up --build
#
# Starts the FastAPI server on http://localhost:8000 — same image
# deployed to Render. No volumes needed: input comes in as JSON over
# HTTP, not from local data/ files.
services:
  resume-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    image: resume-engine:latest
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
