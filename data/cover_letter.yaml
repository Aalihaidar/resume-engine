body_paragraphs:
  - "I am writing to apply for the Digital, AI and Innovation Internship with UNDP's DAI Hub, with particular interest in the Digital and AI Initiatives and Product Design, Development and Management workstreams. I hold an MSc (Honours) in Robotics and Artificial Intelligence from ITMO University, where my thesis examined real-time visual object tracking using deep learning, and I have since built hands-on delivery experience across applied AI/ML, computer vision, and industrial automation."
  - "As a Freelance AI/ML Engineer, I designed and shipped an agentic RAG chatbot backend for a bilingual (Russian/English) restaurant chain, built on FastAPI, LangGraph, and Weaviate Cloud, with production logging and observability implemented through Arize Phoenix. I later adapted the same architecture for a gym client. At IROS-System, I brought applied machine learning into an industrial CAD workflow, developing a cost-prediction regression model and a cosine-similarity-based part-matching system directly from bill-of-materials and assembly data."
  - "This technical grounding sits alongside eight years in mechatronics, robotics, and technical training: I designed a Delta Linear Robot with 0.1mm positioning accuracy, supervised robotics and mechatronics capstone projects, and taught CAD, industrial automation, and CAM to more than 100 students at HIAST in Damascus."
  - "I am drawn to this internship specifically because it treats digital and AI capability as infrastructure for development outcomes rather than technology for its own sake, and I would welcome the opportunity to contribute that perspective to the DAI Hub's work. I am submitting my application through both the UNDP Careers portal and the accompanying Airtable form, and I would be glad to provide any further information."

closing: "Sincerely,"
