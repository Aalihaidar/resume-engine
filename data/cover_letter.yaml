body_paragraphs:
  - "I am writing to apply for the Senior AI Engineer role in VentureOne's Foundry team. I hold an MSc (Honors) in Robotics and Artificial Intelligence from ITMO University, where my thesis examined real-time visual object tracking with deep learning, and I now build applied AI systems that go from idea to a working product."
  - "As a freelance AI/ML engineer, I designed and built the backend of an agentic RAG chatbot for a bilingual (Russian/English) restaurant chain, using a LangGraph agent with hybrid vector and keyword search over Weaviate Cloud, served through FastAPI. I implemented logging, monitoring and tracing with Arize Phoenix, launched a live prototype (a web chat page and a Telegram bot sharing one agent), and adapted the same architecture for a gym client. At IROS-System, I built a cost-prediction regression model and a cosine-similarity part-matching system from bill-of-materials and assembly data using Python, pandas and scikit-learn."
  - "This sits on top of eight years in mechatronics, robotics and technical training. I supervised capstone robotics projects and taught CAD, industrial automation and CAM to more than 100 students at HIAST in Damascus, so I am used to leading technical work and explaining it clearly."
  - "The Foundry's path from new venture idea to working MVP is exactly the kind of work I want to do. I am open to relocating to Abu Dhabi and would be glad to walk you through my architecture or share my code (github.com/Aalihaidar)."

