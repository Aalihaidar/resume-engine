name: "Ali Haidar"
headline: "Headline or tagline goes here, e.g. 'AI/ML Engineer | Robotics Engineer'"

# Master on/off switch per top-level section.
sections:
  summary: true
  experience: true
  education: true
  skills: true
  certifications: true
  languages: true
  photo: true

contact:
  location: "Berlin, Germany"
  phone: "+49 151 23456789"
  email: "jane.doe@example.com"
  linkedin_display: "linkedin.com/in/janedoe"
  linkedin_url: "https://www.linkedin.com/in/janedoe/"
  github_display: "github.com/janedoe"
  github_url: "https://github.com/janedoe"

# Filename inside src/resume_builder/static/, or null to omit. Also gated by
# sections.photo above — both must be true/non-null for the photo to show.
photo: headshot.jpg

summary: >
  One-paragraph, 3-5 sentence overview: your role, years of experience,
  domain focus, and one or two standout achievements. Written in third
  person, no "I".

# -----------------------------------------------------------------------
# EXPERIENCE — most recent first. Keep bullets to ~2 lines, start with a
# strong verb, quantify wherever a real number exists. Do not invent numbers.
# Set include: false on an entry to hide it (e.g. an older/less relevant
# role) without deleting it.
# -----------------------------------------------------------------------
experience:
  - include: true
    title: "Job Title"
    company: "Company Name"
    location: "City, Country"
    start: "Mon YYYY"
    end: "Present"
    bullets:
      - "Achievement-focused bullet starting with a strong past/present-tense verb."
      - "Another bullet, ideally with a quantified outcome (%, $, time saved)."

  - include: true
    title: "Previous Job Title"
    company: "Previous Company"
    location: "City, Country"
    start: "Mon YYYY"
    end: "Mon YYYY"
    bullets:
      - "Bullet describing scope and impact."
      - "Bullet describing a specific technical contribution."

# -----------------------------------------------------------------------
# EDUCATION
# -----------------------------------------------------------------------
education:
  - include: true
    degree: "Degree, Field of Study"
    institution: "Institution Name"
    location: "City, Country"
    start: "Mon YYYY"
    end: "Mon YYYY"
    details:
      - "Honors, thesis title, or notable coursework (optional)."

# -----------------------------------------------------------------------
# SKILLS — grouped for ATS category matching. include: false hides an
# entire category (e.g. omit "Languages: French" tooling from a resume
# where it's not relevant).
# -----------------------------------------------------------------------
skills:
  - include: true
    category: "Category Name"
    items:
      - "Skill 1"
      - "Skill 2"
      - "Skill 3"

# -----------------------------------------------------------------------
# CERTIFICATIONS — most recent first.
# -----------------------------------------------------------------------
certifications:
  - include: true
    name: "Certification Name"
    issuer: "Issuing Organization"
    date: "Mon YYYY"

# -----------------------------------------------------------------------
# LANGUAGES
# -----------------------------------------------------------------------
languages:
  - include: true
    name: "English"
    level: "Native"
  - include: true
    name: "German"
    level: "B2"
