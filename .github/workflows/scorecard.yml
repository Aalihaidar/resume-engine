name: Scorecard

# OpenSSF Scorecard: grades the repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, …), uploads findings
# to code scanning and publishes the score behind the README badge.
#
# publish_results: true puts strict limits on this file: no top-level env or
# write permissions, and only allow-listed actions in the job. Keep it as is.
#
# Scorecard only publishes from the repository's default branch (`develop`);
# the schedule also runs there, since GitHub runs schedules on the default branch.
on:
  push:
    branches: [develop]
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC
  workflow_dispatch:

# The job below declares the only scopes it needs (public repo: no contents
# or actions read required).
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish results / badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
