<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Resume Engine</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    theme: {

        "colors": {
                "inverse-primary": "#006c49",
                "text-on-surface": "#dae2fd",
                "error": "#ffb4ab",
                "on-secondary-container": "#00452e",
                "on-primary-fixed-variant": "#005236",
                "secondary-fixed-dim": "#45dfa4",
                "glass-border": "rgba(218, 226, 253, 0.1)",
                "on-tertiary-fixed-variant": "#39485a",
                "tertiary": "#b9c8de",
                "surface": "#0b1326",
                "surface-container-highest": "#2d3449",
                "on-error-container": "#ffdad6",
                "teal-primary": "#10b981",
                "on-surface-variant": "#bbcabf",
                "surface-variant": "#2d3449",
                "on-tertiary-fixed": "#0d1c2d",
                "primary-container": "#10b981",
                "surface-container": "#171f33",
                "on-primary": "#003824",
                "outline": "#86948a",
                "surface-container-high": "#222a3d",
                "on-secondary": "#003825",
                "tertiary-fixed-dim": "#b9c8de",

                "surface-bright": "#31394d",

                "on-secondary-fixed": "#002114",
                "secondary-container": "#00bd85",
                "primary-fixed-dim": "#4edea3",
                "surface-container-low": "#131b2e",
                "on-error": "#690005",

                "code-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                "headline-md": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                "label-xs": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],

      },
    },
  }
</script>
<style>
  body { font-family: 'Geist', sans-serif; }
  .code-font { font-family: 'JetBrains Mono', monospace; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2d3449; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #10b981; }

  .glass-panel {
      background: rgba(23, 31, 51, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(218, 226, 253, 0.1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  /* -- interactive states driven by JS class toggles -- */
  .tab {
    padding: 6px 16px;
    border-radius: 0.125rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 20px;
    font-weight: 500;
    color: #bbcabf;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab:hover { background: rgba(218,226,253,0.05); color: #dae2fd; }
  .tab.active { background: #10b981; color: #00422b; }

  #status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 0.125rem;
    color: #bbcabf;
    background: rgba(187,202,191,0.06);
    border: 1px solid rgba(187,202,191,0.12);
  }
  #status.ok { color: #4edea3; background: rgba(78,222,163,0.1); border-color: rgba(78,222,163,0.25); }
  #status.error { color: #ffb4ab; background: rgba(255,180,171,0.1); border-color: rgba(255,180,171,0.25); }
  #status:empty { display: none; }


  #pdfOverlay { display: none; }
  #pdfOverlay.visible { display: flex; }

  #yamlInput { caret-color: #4edea3; }
  #yamlInput::placeholder { color: #3c4a42; }

  #lineNumbers { white-space: pre; }
</style>
</head>
<body class="bg-background text-on-surface h-screen flex flex-col overflow-hidden">
<!-- TopNavBar -->
<nav class="bg-surface-container/80 backdrop-blur-xl border-b border-white/10 flex justify-between items-center px-gutter py-unit h-16 w-full flex-shrink-0">
  <div class="flex items-center gap-4">
    <div class="text-body-lg font-display-lg font-bold tracking-tighter text-on-surface">
      Resume Engine
    </div>
    <div class="hidden md:flex gap-2 ml-8" role="tablist">
      <button type="button" class="tab active" data-kind="resume" role="tab" aria-selected="true">Resume</button>
      <button type="button" class="tab" data-kind="cover-letter" role="tab" aria-selected="false">Cover Letter</button>
    </div>
  </div>
  <button type="button" id="downloadBtn" disabled class="bg-primary hover:bg-primary-container text-on-primary disabled:opacity-40 disabled:cursor-default disabled:hover:bg-primary font-bold py-1.5 px-6 rounded transition-colors text-body-md font-body-md flex items-center gap-2 border-t border-white/30">
    <span class="material-symbols-outlined text-[18px]">download</span>Download PDF
  </button>
</nav>

<!-- Main Workspace Split -->
<main class="flex-1 flex flex-col md:flex-row overflow-hidden relative p-gutter gap-gutter bg-surface">

  <!-- Engine / Code Editor (Left) -->
  <section class="w-full md:w-1/2 h-full flex flex-col glass-panel rounded-xl overflow-hidden relative">
    <div class="flex justify-between items-center px-4 py-2 h-11 border-b border-white/5 bg-surface-container-low flex-shrink-0">
      <div class="flex items-center gap-3">
        <span class="text-label-xs font-label-xs text-on-surface-variant uppercase tracking-wider">YAML</span>
        <label id="photoLabel" style="display:none;" class="text-primary hover:bg-white/5 transition-colors px-3 py-1 rounded text-label-xs font-label-xs border border-primary/30 uppercase cursor-pointer">
          Set Photo
          <input type="file" id="photoInput" accept="image/png,image/jpeg,image/webp" class="hidden" />
        </label>
        <button type="button" id="removePhotoBtn" style="display:none;" class="text-on-surface-variant hover:text-error hover:border-error/40 transition-colors px-3 py-1 rounded text-label-xs font-label-xs border border-outline-variant uppercase">
          Remove
        </button>
      </div>
      <button type="button" id="loadExampleBtn" class="text-label-xs font-label-xs text-on-surface hover:text-primary transition-colors border border-outline-variant px-3 py-1 rounded">
        Load template
      </button>
    </div>
    <div class="flex-1 flex overflow-hidden bg-surface-container-lowest relative">
      <div id="lineNumbers" class="w-12 flex-shrink-0 py-4 px-2 text-right bg-surface-container-lowest border-r border-white/5 text-on-surface-variant/40 code-font text-code-sm select-none overflow-hidden">1</div>
      <textarea id="yamlInput" spellcheck="false" class="flex-1 h-full resize-none bg-transparent text-tertiary code-font text-code-sm leading-relaxed p-4 outline-none overflow-auto"></textarea>
    </div>
  </section>

  <!-- Output / Preview (Right) -->
  <section class="w-full md:w-1/2 h-full flex flex-col glass-panel rounded-xl overflow-hidden relative">
    <div class="flex justify-between items-center px-4 py-2 h-11 border-b border-white/5 bg-surface-container-low flex-shrink-0">
      <span class="text-label-xs font-label-xs text-on-surface-variant uppercase tracking-wider">Preview</span>
    </div>
    <div id="pdfPane" class="flex-1 relative bg-white overflow-hidden">
      <div id="pdfPlaceholder" class="absolute inset-0 flex items-center justify-center text-center text-gray-400 text-body-md font-body-md p-10">
        Start typing — the preview renders automatically.
      </div>
      <iframe id="pdfFrame" style="display:none;" class="w-full h-full border-0"></iframe>
      <div id="pdfOverlay" class="absolute inset-0 items-center justify-center bg-black/50 backdrop-blur-sm text-white text-label-xs font-label-xs">
        Rendering…
      </div>
    </div>
  </section>
</main>

<!-- Footer -->
<footer class="bg-surface-container-lowest/90 backdrop-blur-md border-t border-white/5 flex justify-between items-center px-gutter py-2 h-12 flex-shrink-0">
  <div class="flex items-center gap-4">
    <span id="status"></span>
  </div>
  <div class="text-label-xs font-label-xs text-on-surface-variant flex items-center gap-4">
    <span>Resume Engine © 2026</span>
  </div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>
  const tabs = document.querySelectorAll('.tab');
  const yamlInput = document.getElementById('yamlInput');
  const statusEl = document.getElementById('status');
  const downloadBtn = document.getElementById('downloadBtn');
  const loadExampleBtn = document.getElementById('loadExampleBtn');
  const photoLabel = document.getElementById('photoLabel');
  const photoInput = document.getElementById('photoInput');
  const removePhotoBtn = document.getElementById('removePhotoBtn');
  const pdfFrame = document.getElementById('pdfFrame');
  const pdfPlaceholder = document.getElementById('pdfPlaceholder');
  const pdfOverlay = document.getElementById('pdfOverlay');

  let kind = 'resume';
  let currentBlobUrl = null;
  let debounceTimer = null;
  let requestSeq = 0;

  // Photo lives entirely in JS memory, never written into the YAML textarea.
  // It's merged into the payload only at render/submit time — this keeps the
  // editor readable (no giant base64 blob inline) and keeps every keystroke's
  // debounced re-render from re-transmitting the full image on unrelated edits.
  let currentPhotoDataUrl = null;
  let currentPhotoName = null;

  const MAX_UPLOAD_BYTES = 15 * 1024 * 1024;   // raw file guard, before compression
  const MAX_ENCODED_BYTES = 2 * 1024 * 1024;   // guard on the compressed data URI
  const MAX_PHOTO_DIMENSION = 900;             // px, longest side, after downscale
  const PHOTO_JPEG_QUALITY = 0.85;

  const templates = {
    resume: `name: "Jane Doe"
headline: "Headline or tagline goes here, e.g. 'AI/ML Engineer | Robotics Engineer'"

# Master on/off switch per top-level section.
sections:
  summary: true
  experience: true
  projects: true
  education: true
  skills: true
  certifications: true
  languages: true
  photo: false

contact:
  location: "Berlin, Germany"
  phone: "+49 151 23456789"
  email: "jane.doe@example.com"
  linkedin_display: "linkedin.com/in/janedoe"
  linkedin_url: "https://www.linkedin.com/in/janedoe/"
  github_display: "github.com/janedoe"
  github_url: "https://github.com/janedoe"

summary: >
  One-paragraph, 3-5 sentence overview: your role, years of experience,
  domain focus, and one or two standout achievements. Written in third
  person, no "I".

# -----------------------------------------------------------------------
# EXPERIENCE
# -----------------------------------------------------------------------
experience:
  - include: true
    title: "Job Title"
    company: "Company Name"
    location: "City, Country"
    start: "Mon YYYY"
    end: "Present"
    bullets:
      - "Achievement-focused bullet starting with a strong past/present-tense verb."
      - "Another bullet, ideally with a quantified outcome (%, $, time saved)."

  - include: true
    title: "Previous Job Title"
    company: "Previous Company"
    location: "City, Country"
    start: "Mon YYYY"
    end: "Mon YYYY"
    bullets:
      - "Bullet describing scope and impact."
      - "Bullet describing a specific technical contribution."

# -----------------------------------------------------------------------
# PROJECTS
# -----------------------------------------------------------------------
projects:
  - include: true
    name: "Project Name"
    organization: "Associated with X University" # optional — delete this line to omit
    start: "Mon YYYY"
    end: "Mon YYYY"
    bullets:
      - "What you built and why, in one sentence."
      - "A specific technical contribution or design decision."
      - "A quantified result or outcome, if you have a real number."
    technologies:
      - "Tech 1"
      - "Tech 2"
    links:
      - label: "GitHub"
        url: "https://github.com/janedoe/project-name"
      - label: "Live Demo"
        url: "https://project-name.example.com"

# -----------------------------------------------------------------------
# EDUCATION
# -----------------------------------------------------------------------
education:
  - include: true
    degree: "Degree, Field of Study"
    institution: "Institution Name"
    location: "City, Country"
    start: "Mon YYYY"
    end: "Mon YYYY"
    details:
      - "Honors, thesis title, or notable coursework (optional)."

# -----------------------------------------------------------------------
# SKILLS
# -----------------------------------------------------------------------
skills:
  - include: true
    category: "Category Name"
    items:
      - "Skill 1"
      - "Skill 2"
      - "Skill 3"

# -----------------------------------------------------------------------
# CERTIFICATIONS.
# -----------------------------------------------------------------------
certifications:
  - include: true
    name: "Certification Name"
    issuer: "Issuing Organization"
    date: "Mon YYYY"

# -----------------------------------------------------------------------
# LANGUAGES
# -----------------------------------------------------------------------
languages:
  - include: true
    name: "English"
    level: "Native"
  - include: true
    name: "German"
    level: "B2"
`,
    'cover-letter': `applicant_name: "Jane Doe"

applicant_contact:
  location: "Berlin, Germany"
  phone: "+49 151 23456789"
  email: "jane.doe@example.com"
  linkedin_display: "linkedin.com/in/janedoe"
  linkedin_url: "https://www.linkedin.com/in/janedoe/"
  github_display: "github.com/janedoe"
  github_url: "https://github.com/janedoe"


sections:
  date: true
  recipient: true
  body: true

date: "Mon DD, YYYY"

recipient:
  name: null
  title: "Hiring Manager"
  company: "Company Name"
  company_address: null

role_title: "Job Title you're applying for"
salutation: "Dear Hiring Manager,"


body_paragraphs:
  - "Opening paragraph: who you are, the role and company you're applying to, and a one-line hook."
  - "Core paragraph: your strongest relevant achievement(s), with real detail and quantified outcomes where they exist."
  - "Optional paragraph: additional relevant breadth, background, or context not covered above."
  - "Closing paragraph: interest in discussing further, thank the reader for their time."

closing: "Sincerely,"
`
  };

  function endpointFor(k) {
    return k === 'resume' ? '/api/resume/pdf' : '/api/cover-letter/pdf';
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  function showOverlay(show) {
    pdfOverlay.classList.toggle('visible', show);
  }

  function clearPhoto() {
    currentPhotoDataUrl = null;
    currentPhotoName = null;
    updatePhotoStatus();
  }

  function updatePhotoStatus() {
    if (currentPhotoDataUrl) {
      removePhotoBtn.style.display = 'inline-block';
    } else {
      removePhotoBtn.style.display = 'none';
    }
  }

  function loadTemplate() {
    yamlInput.value = templates[kind];
    clearPhoto();
    scheduleRender(0);
  }

  function parseYaml(raw) {
    // jsyaml.load throws jsyaml.YAMLException with a readable .message
    // (including the line/column) on malformed YAML.
    return jsyaml.load(raw);
  }

  // Downscales + re-encodes an image file client-side so a resume headshot
  // never ships as an untouched multi-MB phone photo. Always outputs JPEG,
  // which compresses far better than PNG for photos.
  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const objectUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(objectUrl);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        reject(new Error('Could not decode that image file'));
      };
      img.src = objectUrl;
    });
  }

  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    kind = t.dataset.kind;
    photoLabel.style.display = kind === 'resume' ? 'block' : 'none';
    resetPreview();
    loadTemplate();
  }));

  loadExampleBtn.addEventListener('click', loadTemplate);

  removePhotoBtn.addEventListener('click', () => {
    clearPhoto();
    scheduleRender(0);
  });

  photoInput.addEventListener('change', async () => {
    const file = photoInput.files[0];
    photoInput.value = ''; // allow re-selecting the same file later
    if (!file) return;

    if (file.size > MAX_UPLOAD_BYTES) {
      setStatus(`That image is too large (${Math.round(file.size / 1024 / 1024)}MB, max 15MB before compression)`, 'error');
      return;
    }

    setStatus('Compressing photo…');
    try {
      const dataUrl = await compressImage(file, MAX_PHOTO_DIMENSION, PHOTO_JPEG_QUALITY);
      const base64Len = dataUrl.length - dataUrl.indexOf(',') - 1;
      const approxBytes = Math.round(base64Len * 0.75);

      if (approxBytes > MAX_ENCODED_BYTES) {
        setStatus(`Photo is still too large after compression (~${Math.round(approxBytes / 1024)}KB, max ${MAX_ENCODED_BYTES / 1024 / 1024}MB) — try a smaller or simpler image`, 'error');
        return;
      }

      currentPhotoDataUrl = dataUrl;
      currentPhotoName = file.name;
      updatePhotoStatus();
      setStatus('');
      scheduleRender(0);
    } catch (e) {
      setStatus(e.message, 'error');
    }
  });

  function resetPreview() {
    if (currentBlobUrl) {
      URL.revokeObjectURL(currentBlobUrl);
      currentBlobUrl = null;
    }
    pdfFrame.style.display = 'none';
    pdfFrame.src = '';
    pdfPlaceholder.style.display = 'flex';
    downloadBtn.disabled = true;
    setStatus('');
  }

  yamlInput.addEventListener('input', () => scheduleRender(700));

  function scheduleRender(delayMs) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderPreview, delayMs);
  }

  async function renderPreview() {
    const raw = yamlInput.value.trim();
    if (!raw) {
      resetPreview();
      return;
    }

    let payload;
    try {
      payload = parseYaml(raw);
    } catch (e) {
      setStatus('Invalid YAML: ' + e.message, 'error');
      downloadBtn.disabled = true;
      return;
    }

    // Photo is merged in here, right before sending — it never lives in the
    // YAML text itself, so it doesn't get re-parsed/re-typed by the user
    // and doesn't bloat every debounced request beyond what changed.
    // Also force sections.photo on, since the default template ships with
    // it off (no-photo-by-default) and an uploaded photo should always show.
    if (kind === 'resume' && currentPhotoDataUrl) {
      payload.photo = currentPhotoDataUrl;
      payload.sections = { ...(payload.sections || {}), photo: true };
    }

    const seq = ++requestSeq;
    showOverlay(true);
    setStatus('Rendering…');

    try {
      const res = await fetch(endpointFor(kind), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (seq !== requestSeq) return; // a newer request superseded this one

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        let detail;
        if (Array.isArray(err.detail)) {
          detail = err.detail.map(d => `${(d.loc || []).join('.')}: ${d.msg}`).join('\n');
        } else if (err.detail) {
          detail = typeof err.detail === 'string' ? err.detail : JSON.stringify(err.detail);
        } else if (Object.keys(err).length > 0) {
          detail = JSON.stringify(err);
        } else {
          detail = '';
        }
        setStatus(detail || `Render failed (${res.status})`, 'error');
        downloadBtn.disabled = true;
        showOverlay(false);
        return;
      }

      const blob = await res.blob();
      if (seq !== requestSeq) return;

      if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
      currentBlobUrl = URL.createObjectURL(blob);
      pdfFrame.src = currentBlobUrl;
      pdfFrame.style.display = 'block';
      pdfPlaceholder.style.display = 'none';
      downloadBtn.disabled = false;
      setStatus('Up to date', 'ok');
    } catch (e) {
      if (seq !== requestSeq) return;
      setStatus(e.message, 'error');
      downloadBtn.disabled = true;
    } finally {
      if (seq === requestSeq) showOverlay(false);
    }
  }

  downloadBtn.addEventListener('click', () => {
    if (!currentBlobUrl) return;
    const a = document.createElement('a');
    a.href = currentBlobUrl;
    a.download = kind === 'resume' ? 'resume.pdf' : 'cover_letter.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  photoLabel.style.display = kind === 'resume' ? 'block' : 'none';
  loadTemplate();

  // --- Line-number gutter (visual only, additive; does not touch existing logic) ---
  const lineNumbersEl = document.getElementById('lineNumbers');
  function updateLineNumbers() {
    if (!lineNumbersEl) return;
    const count = yamlInput.value.split('\n').length;
    let out = '';
    for (let i = 1; i <= count; i++) out += i + '\n';
    lineNumbersEl.textContent = out;
  }
  yamlInput.addEventListener('input', updateLineNumbers);
  yamlInput.addEventListener('scroll', () => { lineNumbersEl.scrollTop = yamlInput.scrollTop; });
  updateLineNumbers();

</script>
</body>
</html>
