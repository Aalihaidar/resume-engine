<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="color-scheme" content="dark"/>
<meta name="description" content="Write a resume or cover letter as YAML and get an ATS-safe PDF."/>
<title>Resume Engine</title>
<link href="/assets/favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="/assets/favicon.png" rel="icon" type="image/png" sizes="256x256"/>
<link href="/assets/favicon.png" rel="apple-touch-icon"/>
<!-- Link previews (LinkedIn, Slack, Telegram, ...) need an absolute image URL. -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="Resume Engine"/>
<meta property="og:title" content="Resume Engine: YAML in, ATS-safe PDF out"/>
<meta property="og:description" content="Write a resume or cover letter as YAML and get a clean single-column PDF that applicant-tracking systems can parse. CLI, JSON API and web form."/>
<meta property="og:url" content="https://resume-engine-sud4.onrender.com/"/>
<meta property="og:image" content="https://resume-engine-sud4.onrender.com/assets/social-preview.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="Resume Engine: YAML in, ATS-safe PDF out"/>
<meta name="twitter:card" content="summary_large_image"/>
<!-- CSS, fonts and scripts are self-hosted (built from /web); the page's
     Content-Security-Policy allows nothing from third parties. -->
<link href="/assets/app.css" rel="stylesheet"/>
<script src="/assets/js-yaml.min.js" defer></script>
<script src="/assets/app.js" defer></script>
</head>
<body class="bg-background text-on-surface h-screen flex flex-col overflow-hidden">
<!-- TopNavBar: one row from md up; on narrow screens the tabs wrap onto a second row -->
<nav class="bg-surface-container/80 backdrop-blur-xl border-b border-white/10 flex flex-wrap items-center gap-x-4 gap-y-2 px-gutter py-2 md:py-unit md:h-16 md:flex-nowrap w-full flex-shrink-0" aria-label="Main">
  <div class="order-1 text-body-lg font-display-lg font-bold tracking-tighter text-on-surface whitespace-nowrap">
    Resume Engine
  </div>
  <div class="order-3 md:order-2 w-full md:w-auto flex gap-2 md:ml-4" role="group" aria-label="Document type">
    <button type="button" class="tab" data-kind="resume" aria-pressed="true">Resume</button>
    <button type="button" class="tab" data-kind="cover-letter" aria-pressed="false">Cover Letter</button>
  </div>
  <button type="button" id="downloadBtn" disabled class="order-2 md:order-3 ml-auto focus-ring bg-primary hover:bg-primary-container text-on-primary disabled:opacity-40 disabled:cursor-default disabled:hover:bg-primary font-bold py-1.5 px-4 md:px-6 rounded transition-colors text-body-md font-body-md flex items-center gap-2 border-t border-white/30">
    <svg class="w-[18px] h-[18px] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
    Download PDF
  </button>
</nav>

<!-- Main Workspace Split -->
<main class="flex-1 flex flex-col md:flex-row overflow-hidden relative p-gutter gap-gutter bg-surface">

  <!-- Engine / Code Editor (Left) -->
  <section class="w-full md:w-1/2 h-full flex flex-col glass-panel rounded-xl overflow-hidden relative" aria-label="YAML editor">
    <div class="flex justify-between items-center px-4 py-2 h-11 border-b border-white/5 bg-surface-container-low flex-shrink-0">
      <div class="flex items-center gap-3">
        <label for="yamlInput" class="text-label-xs font-label-xs text-on-surface-variant uppercase tracking-wider">YAML</label>
        <label id="photoLabel" hidden class="focus-within:outline-2 focus-within:outline-primary text-primary hover:bg-white/5 transition-colors px-3 py-1 rounded text-label-xs font-label-xs border border-primary/30 uppercase cursor-pointer">
          Set Photo
          <input type="file" id="photoInput" accept="image/png,image/jpeg,image/webp" class="sr-only" />
        </label>
        <button type="button" id="removePhotoBtn" hidden class="focus-ring text-on-surface-variant hover:text-error hover:border-error/40 transition-colors px-3 py-1 rounded text-label-xs font-label-xs border border-outline-variant uppercase">
          Remove
        </button>
      </div>
      <button type="button" id="loadExampleBtn" class="focus-ring text-label-xs font-label-xs text-on-surface hover:text-primary transition-colors border border-outline-variant px-3 py-1 rounded">
        Load template
      </button>
    </div>
    <div class="flex-1 flex overflow-hidden bg-surface-container-lowest relative">
      <div id="lineNumbers" aria-hidden="true" class="w-12 flex-shrink-0 py-4 px-2 text-right bg-surface-container-lowest border-r border-white/5 text-on-surface-variant/40 code-font text-code-sm select-none overflow-hidden">1</div>
      <textarea id="yamlInput" spellcheck="false" autocomplete="off" autocapitalize="off" class="flex-1 h-full resize-none bg-transparent text-tertiary code-font text-code-sm leading-relaxed p-4 outline-none overflow-auto"></textarea>
    </div>
  </section>

  <!-- Output / Preview (Right) -->
  <section class="w-full md:w-1/2 h-full flex flex-col glass-panel rounded-xl overflow-hidden relative" aria-label="PDF preview">
    <div class="flex justify-between items-center px-4 py-2 h-11 border-b border-white/5 bg-surface-container-low flex-shrink-0">
      <span class="text-label-xs font-label-xs text-on-surface-variant uppercase tracking-wider">Preview</span>
    </div>
    <div id="pdfPane" class="flex-1 relative bg-white overflow-hidden">
      <div id="pdfPlaceholder" class="absolute inset-0 flex items-center justify-center text-center text-gray-600 text-body-md font-body-md p-10">
        Start typing — the preview renders automatically.
      </div>
      <iframe id="pdfFrame" title="PDF preview" hidden class="w-full h-full border-0"></iframe>
      <div id="pdfOverlay" hidden class="absolute inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm text-white text-label-xs font-label-xs">
        Rendering…
      </div>
    </div>
  </section>
</main>

<!-- Footer -->
<footer class="bg-surface-container-lowest/90 backdrop-blur-md border-t border-white/5 flex justify-between items-center gap-4 px-gutter py-2 min-h-12 flex-shrink-0">
  <div class="flex items-center gap-4 min-w-0">
    <span id="status" role="status" aria-live="polite"></span>
  </div>
  <div class="text-label-xs font-label-xs text-on-surface-variant flex items-center gap-4 whitespace-nowrap">
    <span>Resume Engine © 2026</span>
  </div>
</footer>
</body>
</html>
