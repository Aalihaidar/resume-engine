name: "Jane Doe"
headline: "Headline or tagline goes here, e.g. 'AI/ML Engineer | Robotics Engineer'"

# Master on/off switch per top-level section.
sections:
  summary: true
  experience: true
  projects: true
  education: true
  skills: true
  certifications: true
  languages: true
  photo: false

contact:
  location: "Berlin, Germany"
  # phone / email take one value, or a list of up to two, e.g.
  #   phone: ["+49 151 23456789", "+1 415 555 0100"]
  #   email: ["jane.doe@example.com", "jane@example.org"]
  phone: "+49 151 23456789"
  email: "jane.doe@example.com"
  linkedin_display: "linkedin.com/in/janedoe"
  linkedin_url: "https://www.linkedin.com/in/janedoe/"
  github_display: "github.com/janedoe"
  github_url: "https://github.com/janedoe"

summary: >
  One-paragraph, 3-5 sentence overview: your role, years of experience,
  domain focus, and one or two standout achievements. Written in third
  person, no "I".

# -----------------------------------------------------------------------
# EXPERIENCE
# -----------------------------------------------------------------------
experience:
  - include: true
    title: "Job Title"
    company: "Company Name"
    location: "City, Country"
    start: "Mon YYYY"
    end: "Present"
    bullets:
      - "Achievement-focused bullet starting with a strong past/present-tense verb."
      - "Another bullet, ideally with a quantified outcome (%, $, time saved)."

  - include: true
    title: "Previous Job Title"
    company: "Previous Company"
    location: "City, Country"
    start: "Mon YYYY"
    end: "Mon YYYY"
    bullets:
      - "Bullet describing scope and impact."
      - "Bullet describing a specific technical contribution."

# -----------------------------------------------------------------------
# PROJECTS
# -----------------------------------------------------------------------
projects:
  - include: true
    name: "Project Name"
    organization: "Associated with X University" # optional — delete this line to omit
    start: "Mon YYYY"
    end: "Mon YYYY"
    bullets:
      - "What you built and why, in one sentence."
      - "A specific technical contribution or design decision."
      - "A quantified result or outcome, if you have a real number."
    technologies:
      - "Tech 1"
      - "Tech 2"
    links:
      - label: "GitHub"
        url: "https://github.com/janedoe/project-name"
      - label: "Live Demo"
        url: "https://project-name.example.com"

# -----------------------------------------------------------------------
# EDUCATION
# -----------------------------------------------------------------------
education:
  - include: true
    degree: "Degree, Field of Study"
    institution: "Institution Name"
    location: "City, Country"
    start: "Mon YYYY"
    end: "Mon YYYY"
    details:
      - "Honors, thesis title, or notable coursework (optional)."

# -----------------------------------------------------------------------
# SKILLS
# -----------------------------------------------------------------------
skills:
  - include: true
    category: "Category Name"
    items:
      - "Skill 1"
      - "Skill 2"
      - "Skill 3"

# -----------------------------------------------------------------------
# CERTIFICATIONS.
# -----------------------------------------------------------------------
certifications:
  - include: true
    name: "Certification Name"
    issuer: "Issuing Organization"
    date: "Mon YYYY"

# -----------------------------------------------------------------------
# LANGUAGES
# -----------------------------------------------------------------------
languages:
  - include: true
    name: "English"
    level: "Native"
  - include: true
    name: "German"
    level: "B2"
